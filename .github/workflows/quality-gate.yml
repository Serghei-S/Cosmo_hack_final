name: Quality and security gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: app/source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check
      - run: pnpm audit --audit-level high
      - name: Start TLS stack with two API replicas
        working-directory: .
        run: sh deployment/start.sh
      - name: Validate persisted workflows and live HTTPS API
        working-directory: .
        run: |
          docker compose exec -T api node --test server/tests/database.test.mjs
          TEST_CA_FILE="$PWD/.secrets/ca.crt" node app/source/scripts/smoke-production.mjs
          docker compose exec -T api node scripts/verify-outbox.mjs
      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-qc-sbom
          path: app/source/sbom.cdx.json
