worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  upstream api {
    zone api 64k;
    server api:8443 resolve;
    keepalive 32;
  }
  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/web.crt;
    ssl_certificate_key /run/secrets/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 17m;
    client_body_timeout 15s;
    limit_conn conn_limit 40;
    root /usr/share/nginx/html;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location ~ ^/(api/|media/) {
      limit_req zone=api_limit burst=150 nodelay;
      proxy_pass https://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_ssl_server_name on;
      proxy_ssl_name api;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/secrets/ca.crt;
      proxy_read_timeout 40s;
      proxy_connect_timeout 3s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
    location /metrics { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
